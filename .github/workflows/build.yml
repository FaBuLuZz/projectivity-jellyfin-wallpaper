name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :app:assembleRelease

      - run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/projectivity-jellyfin-wallpaper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: projectivity-jellyfin-wallpaper
          path: app/build/outputs/apk/release/projectivity-jellyfin-wallpaper.apk
